<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia - Agendamentos</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f2f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            margin-top: 0;
            color: #667eea;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        .filter-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        
        .filter-group input,
        .filter-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        
        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        
        th {
            background: #667eea;
            color: white;
        }
        
        .status-agendado {
            color: #28a745;
            font-weight: bold;
        }
        
        .status-cancelado {
            color: #dc3545;
            font-weight: bold;
        }
        
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        form .form-group {
            margin-bottom: 15px;
        }
        
        form input,
        form select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        form button {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .cancelar-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <h1>Sistema de Agendamentos</h1>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="total-count">0</div>
            <div>Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="agendados-count">0</div>
            <div>Agendados</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="cancelados-count">0</div>
            <div>Cancelados</div>
        </div>
    </div>

    <div class="card">
        <h2>📅 Novo Agendamento</h2>
        <div id="alert"></div>
        <form id="form-agendamento">
            <div class="form-group"><label>Nome do Cliente *</label><input type="text" id="cliente_nome" required placeholder="Digite o nome"></div>
            <div class="form-group"><label>Telefone</label><input type="text" id="cliente_telefone" placeholder="(+351) 999-999-999"></div>
            <div class="form-group"><label>Data *</label><input type="date" id="data" required></div>
            <div class="form-group"><label>Horário *</label><select id="hora" required><option value="">Selecione uma data primeiro</option></select></div>
            <button type="submit">✅ Agendar</button>
        </form>
    </div>

    <div class="card">
        <h2>🔍 Filtros</h2>
        <div class="filters">
            <div class="filter-group"><label>Data</label><input type="date" id="filtro-data"></div>
            <div class="filter-group"><label>Status</label><select id="filtro-status"><option value="todos">Todos</option><option value="agendado">Agendados</option><option value="cancelado">Cancelados</option></select></div>
            <div class="filter-group"><label>Buscar Cliente</label><input type="text" id="filtro-busca" placeholder="Digite o nome"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btn-aplicar">🔍 Aplicar Filtros</button>
            <button class="btn btn-success" id="btn-limpar">🔄 Limpar Filtros</button>
            <button class="btn btn-success" id="btn-exportar">📥 Exportar CSV</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Agendamentos</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-agendamentos">
                    <tr>
                        <td colspan="7" class="loading">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/agendamentos';

        function mostrarMensagem(texto, tipo) {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${tipo}">${texto}</div>`;
            setTimeout(() => alertDiv.innerHTML = '', 5000);
        }

        async function carregarAgendamentos() {
            try {
                const resposta = await fetch(`${API_URL}/filtros`);
                const dados = await resposta.json();

                document.getElementById('total-count').textContent = dados.estatisticas.total;
                document.getElementById('agendados-count').textContent = dados.estatisticas.agendados;
                document.getElementById('cancelados-count').textContent = dados.estatisticas.cancelados;

                const tbody = document.getElementById('lista-agendamentos');
                if (dados.agendamentos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading">Nenhum agendamento encontrado</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                dados.agendamentos.forEach(ag => {
                            const row = tbody.insertRow();
                            row.innerHTML = `
                        <td>${ag.id}</td>
                        <td>${ag.cliente_nome}</td>
                        <td>${ag.cliente_telefone || '-'}</td>
                        <td>${ag.data}</td>
                        <td>${ag.hora.substring(0,5)}</td>
                        <td class="status-${ag.status}">${ag.status === 'agendado' ? '✅ Agendado' : '❌ Cancelado'}</td>
                        <td>${ag.status === 'agendado' ? `<button class="cancelar-btn" onclick="cancelar(${ag.id})">Cancelar</button>` : '—'}</td>
                    `;
                });
            } catch (error) {
                document.getElementById('lista-agendamentos').innerHTML = '<tr><td colspan="7" class="loading">❌ Erro ao carregar</td></tr>';
            }
        }

        async function carregarHorarios(data) {
            if (!data) return;
            const select = document.getElementById('hora');
            select.innerHTML = '<option value="">Carregando...</option>';
            try {
                const resposta = await fetch(`${API_URL}/horarios/${data}`);
                const dados = await resposta.json();
                if (dados.horarios_disponiveis.length === 0) {
                    select.innerHTML = '<option value="">Nenhum horário disponível</option>';
                } else {
                    select.innerHTML = '<option value="">Selecione um horário</option>';
                    dados.horarios_disponiveis.forEach(hora => {
                        const option = document.createElement('option');
                        option.value = hora;
                        option.textContent = hora;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                select.innerHTML = '<option value="">Erro ao carregar horários</option>';
            }
        }

        async function cancelar(id) {
            if (confirm(`Cancelar agendamento ${id}?`)) {
                try {
                    const resposta = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (resposta.ok) {
                        mostrarMensagem('Agendamento cancelado!', 'success');
                        carregarAgendamentos();
                    } else {
                        mostrarMensagem('Erro ao cancelar', 'error');
                    }
                } catch (error) {
                    mostrarMensagem('Erro de conexão', 'error');
                }
            }
        }

        document.getElementById('form-agendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                cliente_nome: document.getElementById('cliente_nome').value,
                cliente_telefone: document.getElementById('cliente_telefone').value,
                data: document.getElementById('data').value,
                hora: document.getElementById('hora').value
            };
            if (!dados.cliente_nome || !dados.data || !dados.hora) {
                mostrarMensagem('Preencha nome, data e horário!', 'error');
                return;
            }
            try {
                const resposta = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                if (resposta.ok) {
                    mostrarMensagem('Agendamento criado!', 'success');
                    document.getElementById('form-agendamento').reset();
                    document.getElementById('data').value = new Date().toISOString().split('T')[0];
                    carregarAgendamentos();
                    carregarHorarios(document.getElementById('data').value);
                } else {
                    mostrarMensagem(resultado.erro, 'error');
                }
            } catch (error) {
                mostrarMensagem('Erro de conexão', 'error');
            }
        });

        document.getElementById('data').addEventListener('change', (e) => carregarHorarios(e.target.value));
        document.getElementById('btn-aplicar').addEventListener('click', async () => {
            const data = document.getElementById('filtro-data').value;
            const status = document.getElementById('filtro-status').value;
            const busca = document.getElementById('filtro-busca').value;
            let url = `${API_URL}/filtros?`;
            if (data) url += `data=${data}&`;
            if (status && status !== 'todos') url += `status=${status}`;
            const resposta = await fetch(url);
            let dados = await resposta.json();
            if (busca && busca.trim() !== '') {
                dados.agendamentos = dados.agendamentos.filter(ag => ag.cliente_nome.toLowerCase().includes(busca.toLowerCase()));
            }
            const tbody = document.getElementById('lista-agendamentos');
            if (dados.agendamentos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">Nenhum resultado encontrado</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            dados.agendamentos.forEach(ag => {
                const row = tbody.insertRow();
                row.innerHTML = `<td>${ag.id}</td><td>${ag.cliente_nome}</td><td>${ag.cliente_telefone || '-'}</td><td>${ag.data}</td><td>${ag.hora.substring(0,5)}</td><td class="status-${ag.status}">${ag.status === 'agendado' ? '✅ Agendado' : '❌ Cancelado'}</td><td>${ag.status === 'agendado' ? `<button class="cancelar-btn" onclick="cancelar(${ag.id})">Cancelar</button>` : '—'}</td>`;
            });
        });

        document.getElementById('btn-limpar').addEventListener('click', () => {
            document.getElementById('filtro-data').value = '';
            document.getElementById('filtro-status').value = 'todos';
            document.getElementById('filtro-busca').value = '';
            carregarAgendamentos();
        });

        document.getElementById('btn-exportar').addEventListener('click', () => {
            const data = document.getElementById('filtro-data').value;
            const status = document.getElementById('filtro-status').value;
            let url = `${API_URL}/exportar?`;
            if (data) url += `data=${data}&`;
            if (status && status !== 'todos') url += `status=${status}`;
            window.open(url, '_blank');
        });

        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('data').min = hoje;
        document.getElementById('data').value = hoje;
        document.getElementById('filtro-data').min = hoje;
        
        carregarHorarios(hoje);
        carregarAgendamentos();
    </script>
</body>

</html>
